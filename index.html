<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengonversi Desimal ke Biner 🔢</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <!-- Header -->
        <header class="app-header">
            <h1>🔢 DECIMAL TO BINARY</h1>
            <p>Konversi angka desimal ke biner & basis bilangan lainnya!</p>
        </header>

        <!-- Form Input -->
        <div class="input-section">
            <label for="decimal-input">Masukkan Angka Desimal (Basis 10):</label>
            <input type="number" id="decimal-input" placeholder="Contoh: 25, 128, 255" min="0" step="1">
            
            <div class="button-group">
                <button id="btn-convert" class="btn-pop btn-primary">Konversi ⚡</button>
                <button id="btn-sample" class="btn-pop btn-secondary">Acak Angka 🎲</button>
                <button id="btn-reset" class="btn-pop btn-danger">Reset 🔄</button>
            </div>
        </div>

        <!-- Visualisasi 8-Bit Grid -->
        <div id="bit-visualization" class="bit-container hidden">
            <small>Visualisasi Byte (8-Bit Layout):</small>
            <div id="bit-grid" class="bit-grid">
                <!-- Generasi bit box melalui JavaScript -->
            </div>
        </div>

        <!-- Kartu Hasil Konversi Basis -->
        <div id="results-container" class="results-grid hidden">
            <div class="info-card highlight-card">
                <span class="info-label">Biner (Basis 2)</span>
                <strong id="res-binary" class="info-value">0</strong>
            </div>
            <div class="info-card">
                <span class="info-label">Oktal (Basis 8)</span>
                <strong id="res-octal" class="info-value">0</strong>
            </div>
            <div class="info-card">
                <span class="info-label">Heksadesimal (Basis 16)</span>
                <strong id="res-hex" class="info-value">0</strong>
            </div>
            <div class="info-card">
                <span class="info-label">Jumlah Bit</span>
                <strong id="res-bit-count" class="info-value">0 Bit</strong>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
